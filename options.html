<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyFs Browser · 设置</title>
    <link rel="stylesheet" href="/options.css">
  </head>
  <body>
    <div class="settings-shell">
      <aside class="settings-sidebar">
        <button id="settingsHomeButton" class="settings-brand" type="button"
          title="返回 AnyFs Browser 主页" aria-label="返回主页">
          <span>H</span>
          <strong>AnyFs Browser</strong>
        </button>
        <nav aria-label="设置分类">
          <button class="settings-nav-item active" type="button">
            <span>⚙</span>
            <strong>通用</strong>
          </button>
        </nav>
      </aside>

      <main class="settings-content">
        <header>
          <button id="settingsBackButton" class="settings-back-button" type="button">
            ← 返回
          </button>
          <h1>通用设置</h1>
          <p>设置会自动保存，并应用到所有插件窗口。</p>
        </header>

        <section class="settings-section">
          <div class="section-title">
            <h2>文件管理器界面</h2>
            <p>选择一种固定风格，不在浏览页面提供临时切换。</p>
          </div>
          <div class="style-options">
            <label class="style-card">
              <input type="radio" name="interfaceStyle" value="finder">
              <span class="preview finder-preview">
                <i class="preview-toolbar"></i>
                <i class="preview-sidebar"></i>
                <i class="preview-content"></i>
              </span>
              <span class="style-copy">
                <strong>macOS Finder</strong>
                <small>圆角面板、柔和层次和紧凑侧边栏</small>
              </span>
              <span class="checkmark">✓</span>
            </label>

            <label class="style-card">
              <input type="radio" name="interfaceStyle" value="windows">
              <span class="preview windows-preview">
                <i class="preview-toolbar"></i>
                <i class="preview-sidebar"></i>
                <i class="preview-content"></i>
              </span>
              <span class="style-copy">
                <strong>Windows Explorer</strong>
                <small>直角布局、清晰分隔和蓝色选中状态</small>
              </span>
              <span class="checkmark">✓</span>
            </label>
          </div>
        </section>

        <section class="settings-section markdown-settings-section">
          <div class="section-title">
            <h2>文档默认显示</h2>
            <p>Markdown 与 HTML 打开时采用这里设置的默认视图。</p>
          </div>
          <div class="setting-row">
            <div>
              <strong>默认阅读宽度</strong>
              <span>宽屏铺满内容区，阅读模式使用更舒适的居中宽度</span>
            </div>
            <div class="layout-setting">
              <label>
                <input type="radio" name="markdownDefaultLayout" value="wide">
                <span>宽屏</span>
              </label>
              <label>
                <input type="radio" name="markdownDefaultLayout" value="reading">
                <span>阅读模式</span>
              </label>
            </div>
          </div>
          <div class="setting-row">
            <div>
              <strong>HTML 默认视图</strong>
              <span>页面模式可交互运行，源码模式用于直接阅读 HTML 代码</span>
            </div>
            <div class="layout-setting">
              <label>
                <input type="radio" name="htmlDefaultViewMode" value="rendered">
                <span>页面</span>
              </label>
              <label>
                <input type="radio" name="htmlDefaultViewMode" value="source">
                <span>源码</span>
              </label>
            </div>
          </div>
        </section>

        <section class="settings-section">
          <div class="section-title">
            <h2>文本编辑</h2>
            <p>适用于文本、代码、JSON、Markdown 和 HTML 文件。</p>
          </div>
          <div class="setting-row">
            <div>
              <strong>默认打开模式</strong>
              <span>文件可写时默认进入编辑模式；只读文件始终使用阅读模式</span>
            </div>
            <div class="layout-setting">
              <label>
                <input type="radio" name="textDefaultMode" value="edit">
                <span>编辑模式</span>
              </label>
              <label>
                <input type="radio" name="textDefaultMode" value="read">
                <span>阅读模式</span>
              </label>
            </div>
          </div>
          <div class="setting-row">
            <div>
              <strong>保存方式</strong>
              <span>自动保存仅在内容修改后触发，停止输入 1 秒后写入</span>
            </div>
            <div class="layout-setting">
              <label>
                <input type="radio" name="textSaveMode" value="manual">
                <span>手动保存</span>
              </label>
              <label>
                <input type="radio" name="textSaveMode" value="auto">
                <span>自动保存</span>
              </label>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div id="savedNotice" class="saved-notice">设置已保存</div>
    <script src="/options.js"></script>
  </body>
</html>
